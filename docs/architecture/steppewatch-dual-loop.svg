<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-labelledby="sw-title sw-desc">
  <title id="sw-title">Steppewatch Dual-Loop Architecture</title>
  <desc id="sw-desc">Idle client silicon (NPU or Apple M-Series) reads local JSONL transcripts from remote frontier agents to run zero-token real-time supervision and collect 5-field JEPA residual episodes.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162033" stroke-width="1"/>
    </pattern>

    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="55%" stop-color="#070f21"/>
      <stop offset="100%" stop-color="#030916"/>
    </linearGradient>

    <linearGradient id="slabGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e1638"/>
      <stop offset="100%" stop-color="#110d24"/>
    </linearGradient>

    <linearGradient id="loop1Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#062c24"/>
      <stop offset="100%" stop-color="#051c19"/>
    </linearGradient>

    <linearGradient id="loop2Grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2c1d07"/>
      <stop offset="100%" stop-color="#191206"/>
    </linearGradient>

    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#22d3ee"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#34d399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#fbbf24"/>
    </marker>
    <marker id="arrowViolet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#a78bfa"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .h1 { font-size: 16px; font-weight: 700; fill: #f8fafc; letter-spacing: 0.4px; }
    .kicker { font-size: 11px; font-weight: 700; letter-spacing: 1.1px; text-transform: uppercase; }
    .card-title { font-size: 14px; font-weight: 700; fill: #f8fafc; }
    .card-sub { font-size: 11.5px; fill: #94a3b8; }
    .item-title { font-size: 12.5px; font-weight: 600; fill: #e2e8f0; }
    .item-sub { font-size: 11px; fill: #94a3b8; }
    .pill-txt { font-size: 11px; font-weight: 600; }
    .edge-txt { font-size: 11px; font-weight: 600; fill: #cbd5e1; }
    .edge-sub { font-size: 10px; fill: #94a3b8; }
    .ns-title { font-size: 11.5px; font-weight: 700; }
    .ns-sub { font-size: 10px; fill: #cbd5e1; }
  </style>

  <!-- Canvas Background + Blueprint Grid -->
  <rect x="0" y="0" width="1200" height="650" rx="14" fill="url(#bgGrad)"/>
  <rect x="0" y="0" width="1200" height="650" rx="14" fill="url(#grid)" opacity="0.65"/>
  <rect x="1" y="1" width="1198" height="648" rx="13" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Header Strip -->
  <rect x="20" y="18" width="1160" height="48" rx="10" fill="#0b1326" stroke="#1e293b" stroke-width="1"/>
  <circle cx="42" cy="42" r="6" fill="#34d399"/>
  <text x="58" y="47" class="h1">STEPPEWATCH</text>
  <text x="192" y="46" class="card-sub">Dual-Loop Client-Silicon Agent Supervision &amp; JEPA Residual Collector</text>

  <!-- Header Metric Pills -->
  <rect x="742" y="29" width="136" height="26" rx="13" fill="#062c24" stroke="#34d399" stroke-width="1"/>
  <text x="810" y="46" text-anchor="middle" class="mono pill-txt" fill="#6ee7b7">0.0 MiB GPU VRAM</text>

  <rect x="888" y="29" width="128" height="26" rx="13" fill="#082f49" stroke="#22d3ee" stroke-width="1"/>
  <text x="952" y="46" text-anchor="middle" class="mono pill-txt" fill="#67e8f9">$0.00 API COST</text>

  <rect x="1026" y="29" width="142" height="26" rx="13" fill="#1e1638" stroke="#a78bfa" stroke-width="1"/>
  <text x="1097" y="46" text-anchor="middle" class="mono pill-txt" fill="#c4b5fd">96.5 MiB INT8 SLAB</text>

  <!-- ===================================================================== -->
  <!-- COLUMN 1: REMOTE FRONTIER AGENTS & SUBAGENTS                          -->
  <!-- ===================================================================== -->
  <rect x="24" y="84" width="290" height="444" rx="12" fill="#0a1628" stroke="#164e63" stroke-width="1.5"/>
  <text x="42" y="110" class="kicker" fill="#22d3ee">1 · REMOTE FRONTIER AGENTS</text>
  <text x="42" y="128" class="card-sub">Already writing append-only local logs</text>

  <!-- Agent Card 1: Claude Code -->
  <rect x="40" y="146" width="258" height="86" rx="9" fill="#082235" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="54" y="170" class="card-title">Claude Code + Subagents</text>
  <text x="54" y="191" class="mono item-sub">~/.claude/projects/*/*.jsonl</text>
  <text x="54" y="210" class="mono item-sub">&lt;id&gt;/subagents/agent-*.jsonl</text>

  <!-- Agent Card 2: Codex CLI -->
  <rect x="40" y="248" width="258" height="82" rx="9" fill="#082235" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="54" y="272" class="card-title">OpenAI Codex CLI</text>
  <text x="54" y="293" class="mono item-sub">~/.codex/sessions/YYYY/MM/DD/</text>
  <text x="54" y="311" class="mono item-sub">rollout-&lt;ts&gt;-&lt;id&gt;.jsonl</text>

  <!-- Agent Card 3: Hermes -->
  <rect x="40" y="346" width="258" height="82" rx="9" fill="#082235" stroke="#22d3ee" stroke-width="1.2"/>
  <text x="54" y="370" class="card-title">Hermes Agent &amp; Custom CLIs</text>
  <text x="54" y="391" class="mono item-sub">~/.hermes/logs/sessions/*.jsonl</text>
  <text x="54" y="409" class="mono item-sub">or any --trace &lt;file.jsonl&gt;</text>

  <!-- Bottom Self-Tap Badge inside Col 1 -->
  <rect x="40" y="446" width="258" height="64" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="54" y="469" class="item-title" fill="#67e8f9">Agent Self-Tap Protocol (AGENTS.md)</text>
  <text x="54" y="488" class="item-sub">INTENT: / STUCK: / END_STATE: checkpoints</text>
  <text x="54" y="502" class="mono edge-sub">scripts/self_tap.py -&gt; JSON</text>

  <!-- ===================================================================== -->
  <!-- ARROW COL 1 -> COL 2                                                  -->
  <!-- ===================================================================== -->
  <line x1="314" y1="296" x2="388" y2="296" stroke="#22d3ee" stroke-width="2.2" marker-end="url(#arrowCyan)"/>
  <rect x="319" y="250" width="66" height="38" rx="6" fill="#071525" stroke="#164e63" stroke-width="1"/>
  <text x="352" y="266" text-anchor="middle" class="edge-txt" fill="#67e8f9">Read-Only</text>
  <text x="352" y="281" text-anchor="middle" class="edge-sub">JSONL tail</text>

  <!-- ===================================================================== -->
  <!-- COLUMN 2: IDLE CLIENT SILICON + PINNED INT8 SLAB                      -->
  <!-- ===================================================================== -->
  <rect x="394" y="84" width="356" height="444" rx="12" fill="#0d1126" stroke="#6d28d9" stroke-width="1.6"/>
  <text x="412" y="110" class="kicker" fill="#c4b5fd">2 · IDLE CLIENT SILICON ENGINE</text>
  <text x="412" y="128" class="card-sub">Intel/AMD NPU (OpenVINO) · Apple M2/M3/M4 (MLX + ANE)</text>

  <!-- Encoder Box -->
  <rect x="410" y="146" width="324" height="66" rx="9" fill="#082420" stroke="#34d399" stroke-width="1.2"/>
  <text x="424" y="170" class="card-title">384-D Local Encoder + Ack Filter</text>
  <text x="424" y="190" class="mono item-sub">all-MiniLM-L6-v2 (INT8/FP16) · 0.0 MiB dGPU</text>
  <text x="424" y="204" class="item-sub">Strips bare tool-ack stubs before sliding-window scoring</text>

  <!-- Down Arrow Encoder -> Slab -->
  <line x1="572" y1="212" x2="572" y2="236" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowViolet)"/>

  <!-- Pinned Zero-Copy INT8 Slab Container -->
  <rect x="410" y="242" width="324" height="268" rx="10" fill="url(#slabGlow)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="424" y="267" class="card-title" fill="#ede9fe">Pinned Quantized Slab [384 × 262,144]</text>
  <text x="424" y="286" class="mono edge-sub" fill="#c4b5fd">96.5 MiB INT8 · 0 Rebinds · Q={8,16,64} MatMul</text>

  <!-- 2x2 Namespace Partition Tiles -->
  <!-- NS_AST -->
  <rect x="424" y="302" width="144" height="72" rx="7" fill="#131c36" stroke="#38bdf8" stroke-width="1.1"/>
  <text x="434" y="322" class="mono ns-title" fill="#38bdf8">NS_AST</text>
  <text x="434" y="340" class="ns-sub">Code &amp; .md symbols</text>
  <text x="434" y="356" class="mono edge-sub">89 files · 848 syms</text>

  <!-- NS_ONTOLOGY -->
  <rect x="576" y="302" width="144" height="72" rx="7" fill="#231c10" stroke="#fbbf24" stroke-width="1.1"/>
  <text x="586" y="322" class="mono ns-title" fill="#fbbf24">NS_ONTOLOGY</text>
  <text x="586" y="340" class="ns-sub">Certified rules</text>
  <text x="586" y="356" class="mono edge-sub">NVIDIA auto-ontology</text>

  <!-- NS_TRAJECTORY -->
  <rect x="424" y="384" width="144" height="72" rx="7" fill="#092420" stroke="#34d399" stroke-width="1.1"/>
  <text x="434" y="404" class="mono ns-title" fill="#34d399">NS_TRAJECTORY</text>
  <text x="434" y="422" class="ns-sub">Live step windows</text>
  <text x="434" y="438" class="mono edge-sub">W=3..6 steps / agent</text>

  <!-- NS_EPISODES -->
  <rect x="576" y="384" width="144" height="72" rx="7" fill="#221438" stroke="#c084fc" stroke-width="1.1"/>
  <text x="586" y="404" class="mono ns-title" fill="#c084fc">NS_EPISODES</text>
  <text x="586" y="422" class="ns-sub">5-field residuals</text>
  <text x="586" y="438" class="mono edge-sub">Δ = surprise history</text>

  <!-- Slab Occupancy Bar -->
  <rect x="424" y="470" width="296" height="24" rx="5" fill="#090d1a" stroke="#334155" stroke-width="1"/>
  <rect x="426" y="472" width="12" height="20" rx="3" fill="#a78bfa"/>
  <text x="446" y="486" class="mono edge-sub" fill="#cbd5e1">0.92% used (2,408 / 262,144) — 99% open</text>

  <!-- ===================================================================== -->
  <!-- BRANCH ARROWS COL 2 -> COL 3 (CLEAN ORTHOGONAL, ZERO OVERLAP)         -->
  <!-- ===================================================================== -->
  <!-- To Loop 1 (Top) -->
  <path d="M 750 224 L 826 224" fill="none" stroke="#34d399" stroke-width="2.2" marker-end="url(#arrowEmerald)"/>
  <rect x="756" y="182" width="66" height="34" rx="6" fill="#05211b" stroke="#065f46" stroke-width="1"/>
  <text x="789" y="197" text-anchor="middle" class="mono edge-sub" fill="#6ee7b7">27–75 ms</text>
  <text x="789" y="210" text-anchor="middle" class="edge-sub">0 tokens</text>

  <!-- To Loop 2 (Bottom) -->
  <path d="M 750 420 L 826 420" fill="none" stroke="#fbbf24" stroke-width="2.2" marker-end="url(#arrowAmber)"/>
  <rect x="756" y="378" width="66" height="34" rx="6" fill="#231706" stroke="#92400e" stroke-width="1"/>
  <text x="789" y="393" text-anchor="middle" class="mono edge-sub" fill="#fde68a">5-Field Δ</text>
  <text x="789" y="406" text-anchor="middle" class="edge-sub">NDJSON</text>

  <!-- ===================================================================== -->
  <!-- COLUMN 3: LOOP 1 (SUPERVISION) & LOOP 2 (JEPA RESIDUAL LEARNING)      -->
  <!-- ===================================================================== -->
  <!-- LOOP 1 CARD (TOP) -->
  <rect x="832" y="84" width="344" height="218" rx="12" fill="url(#loop1Grad)" stroke="#34d399" stroke-width="1.5"/>
  <text x="850" y="110" class="kicker" fill="#34d399">LOOP 1 · REAL-TIME SUPERVISION</text>
  <text x="850" y="128" class="card-sub">Catches rogue drift before tokens burn</text>

  <rect x="848" y="142" width="312" height="44" rx="7" fill="#06211c" stroke="#10b981" stroke-width="0.9"/>
  <text x="860" y="161" class="item-title">Silent Stall &amp; Loop Watchdog</text>
  <text x="860" y="177" class="mono edge-sub">Productive 0.0000 vs. Polite Stall 0.9278</text>

  <rect x="848" y="194" width="312" height="44" rx="7" fill="#06211c" stroke="#10b981" stroke-width="0.9"/>
  <text x="860" y="213" class="item-title">Claim &amp; Line-Anchor Grounding</text>
  <text x="860" y="229" class="mono edge-sub">3/3 errors · 21/26 displaced lines caught</text>

  <rect x="848" y="246" width="312" height="42" rx="7" fill="#06211c" stroke="#10b981" stroke-width="0.9"/>
  <text x="860" y="265" class="item-title">Parallel Tool-Ack Stub Filter</text>
  <text x="860" y="280" class="mono edge-sub">Filters bare acks on bursts (0.72 -&gt; 0.0)</text>

  <!-- LOOP 2 CARD (BOTTOM) -->
  <rect x="832" y="316" width="344" height="212" rx="12" fill="url(#loop2Grad)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="850" y="342" class="kicker" fill="#fbbf24">LOOP 2 · JEPA RESIDUAL LEARNING</text>
  <text x="850" y="360" class="card-sub">Turns every surprise into local intelligence</text>

  <rect x="848" y="374" width="312" height="44" rx="7" fill="#1f1506" stroke="#d97706" stroke-width="0.9"/>
  <text x="860" y="393" class="item-title">5-Field Residual Episodes</text>
  <text x="860" y="409" class="mono edge-sub">s_t · intent · ŝ_next · s_next · Δ surprise</text>

  <rect x="848" y="426" width="312" height="42" rx="7" fill="#1f1506" stroke="#d97706" stroke-width="0.9"/>
  <text x="860" y="445" class="item-title">Tiny Local JEPA Trainer (&lt;2M params)</text>
  <text x="860" y="460" class="mono edge-sub">Updates in &lt;1 s on CPU or M2 Unified Memory</text>

  <rect x="848" y="476" width="312" height="40" rx="7" fill="#1f1506" stroke="#d97706" stroke-width="0.9"/>
  <text x="860" y="495" class="item-title">Human Certification Gate</text>
  <text x="860" y="509" class="mono edge-sub">Recurring traps -&gt; NVIDIA auto-ontology</text>

  <!-- ===================================================================== -->
  <!-- CLEAN BOTTOM FEEDBACK BUS (DEDICATED OPEN RUNWAY, ZERO COLLISIONS)    -->
  <!-- ===================================================================== -->
  <path d="M 1004 528 L 1004 566 L 572 566 L 572 534" fill="none" stroke="#fbbf24" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <rect x="650" y="552" width="290" height="26" rx="13" fill="#1b1407" stroke="#d97706" stroke-width="1"/>
  <text x="795" y="569" text-anchor="middle" class="edge-txt" fill="#fde68a">Sharper risk priors + certified rules feed next run</text>

  <!-- Bottom Provenance Footer Bar -->
  <rect x="24" y="594" width="1152" height="38" rx="8" fill="#091122" stroke="#1e293b" stroke-width="1"/>
  <text x="42" y="618" class="mono edge-sub" fill="#94a3b8">PROVEN NOV 21, 2026 (INTEL ARROW LAKE NPU)  ·  1.57 s WARM INDEX (89 FILES / 848 SYMS)  ·  PORTABLE TO APPLE M2/M3/M4 (24 GB UMA)</text>
  <text x="1158" y="618" text-anchor="end" class="mono edge-sub" fill="#34d399">MIT · github.com/djcdevelopment/steppewatch</text>
</svg>
