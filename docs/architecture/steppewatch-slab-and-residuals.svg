<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 740" width="1220" height="740" role="img" aria-labelledby="seq-title seq-desc">
  <title id="seq-title">Steppewatch UML Sequence Diagram</title>
  <desc id="seq-desc">Enterprise light-theme UML Sequence Diagram showing temporal interactions across Frontier Agent, Local JSONL Transcript, Steppewatch Local Silicon, Pinned INT8 Slab, and JEPA Store with NVIDIA auto-ontology.</desc>

  <defs>
    <marker id="sArrSlate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#334155"/>
    </marker>
    <marker id="sArrBlue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#0369a1"/>
    </marker>
    <marker id="sArrViolet" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#6d28d9"/>
    </marker>
    <marker id="sArrGreen" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#047857"/>
    </marker>
    <marker id="sArrCrimson" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#be123c"/>
    </marker>
    <marker id="sArrAmber" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 1.5 L 9 5 L 1 8.5 z" fill="#b45309"/>
    </marker>
  </defs>

  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .hdr-title { font-size: 16px; font-weight: 700; fill: #0f172a; }
    .hdr-sub { font-size: 11.5px; fill: #475569; }
    .actor-title { font-size: 12.5px; font-weight: 700; fill: #0f172a; }
    .actor-sub { font-size: 10px; fill: #475569; }
    .msg { font-size: 11px; font-weight: 600; fill: #0f172a; }
    .msg-sub { font-size: 10px; fill: #475569; }
    .frag-tag { font-size: 10.5px; font-weight: 700; fill: #ffffff; }
    .guard { font-size: 10.5px; font-weight: 700; }
    .step-num { font-size: 10px; font-weight: 700; fill: #ffffff; }
    .footer-txt { font-size: 10px; fill: #475569; }
  </style>

  <!-- Crisp Enterprise White Canvas -->
  <rect x="0" y="0" width="1220" height="740" rx="12" fill="#ffffff"/>
  <rect x="1" y="1" width="1218" height="738" rx="11" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Title Band -->
  <rect x="1" y="1" width="1218" height="56" rx="11" fill="#f8fafc"/>
  <line x1="1" y1="57" x2="1219" y2="57" stroke="#cbd5e1" stroke-width="1.2"/>
  <rect x="20" y="16" width="6" height="24" rx="3" fill="#6d28d9"/>
  <text x="36" y="29" class="hdr-title">STEPPEWATCH · UML Sequence Diagram (Three-Phase Supervision &amp; Residual Loop)</text>
  <text x="36" y="45" class="hdr-sub">Out-of-Band Supervision · Zero GPU VRAM Contention · Two-Way NVIDIA/auto-ontology Governance</text>
  <text x="1196" y="34" text-anchor="end" class="mono actor-sub" fill="#6d28d9">PAPER.md §2–§5</text>

  <!-- ===================================================================== -->
  <!-- 5 UML PARTICIPANT BOXES (TOP)                                         -->
  <!-- X Centers: 130, 365, 610, 855, 1090                                   -->
  <!-- ===================================================================== -->
  <!-- P1: Frontier Agent -->
  <rect x="30" y="74" width="200" height="52" rx="7" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.5"/>
  <text x="130" y="96" text-anchor="middle" class="actor-title" fill="#0c4a6e">Frontier Agent</text>
  <text x="130" y="114" text-anchor="middle" class="actor-sub">Claude · Codex · Hermes</text>

  <!-- P2: Local JSONL Log -->
  <rect x="265" y="74" width="200" height="52" rx="7" fill="#f8fafc" stroke="#475569" stroke-width="1.5"/>
  <text x="365" y="96" text-anchor="middle" class="actor-title">Local JSONL Log</text>
  <text x="365" y="114" text-anchor="middle" class="mono actor-sub">append-only SSD trace</text>

  <!-- P3: Steppewatch Silicon -->
  <rect x="510" y="74" width="200" height="52" rx="7" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
  <text x="610" y="96" text-anchor="middle" class="actor-title" fill="#064e3b">Steppewatch Engine</text>
  <text x="610" y="114" text-anchor="middle" class="actor-sub">NPU / Apple M2 · 0 dGPU</text>

  <!-- P4: Pinned INT8 Slab -->
  <rect x="755" y="74" width="200" height="52" rx="7" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.5"/>
  <text x="855" y="96" text-anchor="middle" class="actor-title" fill="#4c1d95">Pinned INT8 Slab</text>
  <text x="855" y="114" text-anchor="middle" class="mono actor-sub">[384×262144] · 96.5 MiB</text>

  <!-- P5: JEPA & Ontology -->
  <rect x="990" y="74" width="200" height="52" rx="7" fill="#fffbeb" stroke="#b45309" stroke-width="1.5"/>
  <text x="1090" y="96" text-anchor="middle" class="actor-title" fill="#78350f">JEPA &amp; Ontology</text>
  <text x="1090" y="114" text-anchor="middle" class="actor-sub">Episodes · NVIDIA/auto-ontology</text>

  <!-- Vertical Dashed UML Lifelines -->
  <line x1="130" y1="126" x2="130" y2="660" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 5"/>
  <line x1="365" y1="126" x2="365" y2="660" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 5"/>
  <line x1="610" y1="126" x2="610" y2="660" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 5"/>
  <line x1="855" y1="126" x2="855" y2="660" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 5"/>
  <line x1="1090" y1="126" x2="1090" y2="660" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="6 5"/>

  <!-- UML Execution Activation Bars -->
  <rect x="124" y="148" width="12" height="392" rx="3" fill="#e0f2fe" stroke="#0369a1" stroke-width="1.1"/>
  <rect x="604" y="176" width="12" height="444" rx="3" fill="#d1fae5" stroke="#047857" stroke-width="1.1"/>
  <rect x="849" y="190" width="12" height="38" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.1"/>
  <rect x="849" y="330" width="12" height="38" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.1"/>
  <rect x="849" y="514" width="12" height="42" rx="3" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.1"/>
  <rect x="1084" y="232" width="12" height="28" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>
  <rect x="1084" y="592" width="12" height="54" rx="3" fill="#fef3c7" stroke="#b45309" stroke-width="1.1"/>

  <!-- ===================================================================== -->
  <!-- PHASE 1: PRE-FLIGHT GATE (Y: 150 .. 260)                              -->
  <!-- ===================================================================== -->
  <!-- Step 1: Agent -> JSONL -->
  <line x1="136" y1="164" x2="358" y2="164" stroke="#0369a1" stroke-width="1.8" marker-end="url(#sArrBlue)"/>
  <circle cx="156" cy="150" r="9" fill="#0369a1"/><text x="156" y="153.5" text-anchor="middle" class="step-num">1</text>
  <text x="171" y="154" class="msg">write INTENT: target files &amp; goal</text>

  <!-- Step 2: Engine -> Slab (Pre-Flight) -->
  <line x1="616" y1="202" x2="843" y2="202" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#sArrViolet)"/>
  <circle cx="636" cy="188" r="9" fill="#6d28d9"/><text x="636" y="191.5" text-anchor="middle" class="step-num">2</text>
  <text x="651" y="192" class="msg">/size &amp; /classify_regime</text>
  <text x="651" y="216" class="mono msg-sub">0.37 – 22.1 ms · 0 API tokens</text>

  <!-- Step 3: Engine -> JEPA (Record Pre-Outcome Prior) -->
  <line x1="616" y1="246" x2="1078" y2="246" stroke="#b45309" stroke-width="1.8" marker-end="url(#sArrAmber)"/>
  <circle cx="636" cy="232" r="9" fill="#b45309"/><text x="636" y="235.5" text-anchor="middle" class="step-num">3</text>
  <text x="651" y="236" class="msg">record pre-outcome prior (ŝ_next, r̂_risk)</text>

  <!-- ===================================================================== -->
  <!-- PHASE 2: IN-FLIGHT STREAMING & WATCHDOG (Y: 274 .. 366)               -->
  <!-- ===================================================================== -->
  <!-- Step 4: Agent -> JSONL -->
  <line x1="136" y1="290" x2="358" y2="290" stroke="#0369a1" stroke-width="1.8" marker-end="url(#sArrBlue)"/>
  <circle cx="156" cy="276" r="9" fill="#0369a1"/><text x="156" y="279.5" text-anchor="middle" class="step-num">4</text>
  <text x="171" y="280" class="msg">stream steps &amp; tool calls (async)</text>

  <!-- Step 5: JSONL --> Engine (Read-only tail + ack filter) -->
  <line x1="365" y1="312" x2="598" y2="312" stroke="#334155" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#sArrSlate)"/>
  <circle cx="386" cy="298" r="9" fill="#334155"/><text x="386" y="301.5" text-anchor="middle" class="step-num">5</text>
  <text x="401" y="302" class="msg">read-only tail + filter bare acks</text>

  <!-- Step 6: Engine -> Slab (Batched MatMul) -->
  <line x1="616" y1="348" x2="843" y2="348" stroke="#047857" stroke-width="1.8" marker-end="url(#sArrGreen)"/>
  <circle cx="636" cy="334" r="9" fill="#047857"/><text x="636" y="337.5" text-anchor="middle" class="step-num">6</text>
  <text x="651" y="338" class="msg">/detect_thrash · Q∈{8,16,64} MatMul</text>
  <text x="651" y="362" class="mono msg-sub">NS_TRAJECTORY (W=3..6) · ~27 ms</text>

  <!-- ===================================================================== -->
  <!-- UML ALT COMBINED FRAGMENT: STALL LOOP VS HEALTHY PROGRESSION          -->
  <!-- ===================================================================== -->
  <rect x="44" y="378" width="932" height="196" rx="6" fill="none" stroke="#475569" stroke-width="1.4"/>

  <!-- Top ALT region (Polite Stall / Thrash) -->
  <rect x="45" y="379" width="930" height="72" fill="#fff1f2" opacity="0.72"/>
  <!-- Pentagon alt label tab -->
  <polygon points="44,378 96,378 96,396 86,404 44,404" fill="#334155"/>
  <text x="68" y="395" text-anchor="middle" class="mono frag-tag">alt</text>
  <text x="108" y="396" class="mono guard" fill="#be123c">[Polite Stall / Thrash Loop: score = 0.9278 &gt;= 0.65]</text>

  <!-- Step 7a: Engine -> Agent (Early Abort Alert) -->
  <line x1="604" y1="432" x2="142" y2="432" stroke="#be123c" stroke-width="2" marker-end="url(#sArrCrimson)"/>
  <circle cx="162" cy="418" r="9.5" fill="#be123c"/><text x="162" y="421.5" text-anchor="middle" class="step-num">7a</text>
  <text x="178" y="422" class="msg" fill="#9f1239">ALERT: early_abort_and_reroute (26.9 ms · stops silent stall burn)</text>

  <!-- Horizontal dashed divider between alt branches -->
  <line x1="44" y1="451" x2="976" y2="451" stroke="#475569" stroke-width="1.3" stroke-dasharray="6 4"/>

  <!-- Bottom ALT region (Healthy Progression -> Post-Flight Claim Grounding) -->
  <rect x="45" y="452" width="930" height="121" fill="#ecfdf5" opacity="0.55"/>
  <text x="60" y="470" class="mono guard" fill="#047857">[Healthy Progression: score = 0.0000 &lt; 0.65  -&gt;  Phase 3 Post-Flight Grounding]</text>

  <!-- Step 7b: Agent -> JSONL (Draft Claims & END_STATE) -->
  <line x1="136" y1="498" x2="358" y2="498" stroke="#0369a1" stroke-width="1.8" marker-end="url(#sArrBlue)"/>
  <circle cx="156" cy="484" r="9.5" fill="#0369a1"/><text x="156" y="487.5" text-anchor="middle" class="step-num">7b</text>
  <text x="172" y="488" class="msg">write draft claims &amp; END_STATE:</text>

  <!-- Step 8: Engine -> Slab (Ground Claims vs NS_LINES + NS_ONTOLOGY) -->
  <line x1="616" y1="524" x2="843" y2="524" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#sArrViolet)"/>
  <circle cx="636" cy="510" r="9" fill="#6d28d9"/><text x="636" y="513.5" text-anchor="middle" class="step-num">8</text>
  <text x="651" y="514" class="msg">ground: NS_LINES + NS_ONTOLOGY</text>

  <!-- Step 9: Slab --> Engine (Return Grounded Contradictions) -->
  <line x1="849" y1="554" x2="622" y2="554" stroke="#047857" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#sArrGreen)"/>
  <circle cx="636" cy="540" r="9" fill="#047857"/><text x="636" y="543.5" text-anchor="middle" class="step-num">9</text>
  <text x="651" y="544" class="msg" fill="#065f46">3/3 errors · 21/26 drifts (34–75 ms)</text>

  <!-- ===================================================================== -->
  <!-- PHASE 4: RESIDUAL EPISODE LOGGING & CERTIFICATION LOOP (Y: 590..660)  -->
  <!-- ===================================================================== -->
  <!-- Step 10: Engine -> JEPA Store -->
  <line x1="616" y1="606" x2="1078" y2="606" stroke="#6d28d9" stroke-width="1.8" marker-end="url(#sArrViolet)"/>
  <circle cx="636" cy="592" r="9" fill="#6d28d9"/><text x="636" y="595.5" text-anchor="middle" class="step-num">10</text>
  <text x="651" y="596" class="msg">append 5-field episode (s_t, intent, ŝ_next, s_next, Δ surprise)</text>

  <!-- Step 11: JEPA & Ontology --> Slab (Closed Loop Update) -->
  <line x1="1084" y1="640" x2="861" y2="640" stroke="#b45309" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#sArrAmber)"/>
  <circle cx="876" cy="626" r="9" fill="#b45309"/><text x="876" y="629.5" text-anchor="middle" class="step-num">11</text>
  <text x="891" y="630" class="msg" fill="#92400e">JEPA (&lt;1 s) + certified rules</text>

  <!-- Bottom Participant Footers (UML standard mirrored boxes) -->
  <rect x="30" y="660" width="200" height="32" rx="6" fill="#f0f9ff" stroke="#0369a1" stroke-width="1.2"/>
  <text x="130" y="680" text-anchor="middle" class="actor-title" fill="#0c4a6e">Frontier Agent</text>

  <rect x="265" y="660" width="200" height="32" rx="6" fill="#f8fafc" stroke="#475569" stroke-width="1.2"/>
  <text x="365" y="680" text-anchor="middle" class="actor-title">Local JSONL Log</text>

  <rect x="510" y="660" width="200" height="32" rx="6" fill="#ecfdf5" stroke="#047857" stroke-width="1.2"/>
  <text x="610" y="680" text-anchor="middle" class="actor-title" fill="#064e3b">Steppewatch Engine</text>

  <rect x="755" y="660" width="200" height="32" rx="6" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.2"/>
  <text x="855" y="680" text-anchor="middle" class="actor-title" fill="#4c1d95">Pinned INT8 Slab</text>

  <rect x="990" y="660" width="200" height="32" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="1.2"/>
  <text x="1090" y="680" text-anchor="middle" class="actor-title" fill="#78350f">JEPA &amp; Ontology</text>

  <!-- Provenance Strip -->
  <rect x="20" y="702" width="1180" height="28" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="34" y="720" class="mono footer-txt">VERIFIED NOV 21, 2026 · 0.0 MiB GPU VRAM · 0 REBINDS · PROOF STEP B CALIBRATED (NS_LINES ISOLATED + BARE ACK FILTER)</text>
  <text x="1186" y="720" text-anchor="end" class="mono footer-txt" fill="#0369a1">MIT · github.com/djcdevelopment/steppewatch</text>
</svg>
