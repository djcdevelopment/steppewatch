name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python-tests:
    name: Python (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install minimal runtime dependency (numpy)
        run: python -m pip install --upgrade pip && python -m pip install "numpy>=1.26.0"
      - name: Run offline unit tests with strict ResourceWarning checks
        run: python -W error::ResourceWarning -m unittest discover -s tests -v
      - name: CLI smoke checks (zero-download hash mode)
        run: |
          python scripts/self_tap.py --force-hash --repo .
          python scripts/01_see_the_math_m2.py --force-hash --repo . --receipt receipts/ci_receipt.json
          python scripts/03_train_tiny_jepa.py --demo-synthetic --force-hash --out checkpoints/ci_jepa.npz

  dotnet-tests:
    name: .NET 10 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Run Steppewatch .NET Core & ONNX unit tests
        run: |
          dotnet test dotnet/tests/Steppewatch.Tests/Steppewatch.Tests.csproj -c Release
          dotnet test dotnet/tests/Steppewatch.Onnx.Tests/Steppewatch.Onnx.Tests.csproj -c Release
